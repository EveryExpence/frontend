name: EAS Build

on:
  push:
    branches:
      - release
      - feature/pipelines-and-build

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Trigger Builds (Feature Branch)
        if: github.ref_name != 'release'
        run: |
          eas build --platform all --profile production --non-interactive --no-wait
          eas build --platform android --profile preview --non-interactive --no-wait

      - name: Trigger and Wait for Builds (Release Branch)
        if: github.ref_name == 'release'
        id: build_release
        run: |
          eas build --platform all --profile production --non-interactive
          eas build --platform android --profile preview --non-interactive
          mkdir -p artifacts
          eas build:download --platform android --profile preview --latest --output=artifacts/app-preview.apk
          eas build:download --platform android --profile production --latest --output=artifacts/app-release.aab
          eas build:download --platform ios --profile production --latest --output=artifacts/ios-simulator-build.tar.gz

      - name: Get version from package.json
        if: github.ref_name == 'release'
        id: package_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package_version.outputs.version }}-${{ github.run_number }}
          name: Release v${{ steps.package_version.outputs.version }} (Build #${{ github.run_number }})
          files: |
            artifacts/app-preview.apk
            artifacts/app-release.aab
            artifacts/ios-simulator-build.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
