name: dev-workflow

on:
  push:
    branches:
      - 'dev'

jobs:
  lint-job:
    name: lint job
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run lint